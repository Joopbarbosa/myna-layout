[package]
name = "myna-layout"
version = "0.1.0"
edition = "2024"
description = "Status indicator (floating bar and notification) for the Myna dictation on COSMIC/Wayland"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Joopbarbosa/myna-layout"
readme = "README.md"

[lib]
name = "myna_layout"
path = "src/lib.rs"

[[bin]]
name = "myna-layout"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2.32"
async-channel = "2.5.0"
futures-lite = "2.6.1"
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4.5"
smithay-client-toolkit = "0.21.1"
tiny-skia = "0.12.0"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zbus = "6.1.0"
