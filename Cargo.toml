[package]
name = "myna-layout"
version = "0.1.0"
edition = "2024"
description = "Status indicator (floating bar and notification) for the Myna dictation on COSMIC/Wayland"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Joopbarbosa/myna-layout"
readme = "README.md"

[lib]
name = "myna_layout"
path = "src/lib.rs"

[[bin]]
name = "myna-layout"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2.32"
async-channel = "2.5.0"
futures-lite = "2.6.1"
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4.5"
smithay-client-toolkit = "0.21.1"
tiny-skia = "0.12.0"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zbus = "6.1.0"

[package.metadata.deb]
name = "myna-layout"
maintainer = "João Barbosa <noreply@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "$auto, systemd"
recommends = "ibus"
extended-description = "A session indicator for Myna dictation on COSMIC and Wayland."
assets = [
    ["target/release/myna-layout", "usr/bin/myna-layout", "755"],
    ["packaging/myna-layout.service", "usr/lib/systemd/user/myna-layout.service", "644"],
    ["packaging/myna-layout.desktop", "usr/share/applications/myna-layout.desktop", "644"],
    ["packaging/myna-layout.svg", "usr/share/icons/hicolor/scalable/apps/myna-layout.svg", "644"],
]
maintainer-scripts = "packaging"
